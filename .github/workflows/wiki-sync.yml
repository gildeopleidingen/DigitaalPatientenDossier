name: Sync Docs to GitHub Wiki

on:
  push:
    branches:
      - gabriel
      - develop
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          if git clone "$REPO_URL" wiki_repo; then
            echo "Wiki repository succesvol gecloned."
          else
            echo "Wiki repository nog niet gecloned, opnieuw initialiseren..."
            mkdir wiki_repo
            cd wiki_repo
            git init
            git remote add origin "$REPO_URL"
            cd ..
          fi

          # Kopieer alle bestanden uit docs/ naar wiki_repo/
          cp -r docs/* wiki_repo/

          cd wiki_repo
          git add -A
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te synchroniseren."
          else
            git commit -m "docs: wiki bijgewerkt vanuit docs/ [skip ci]"
            git push origin master || git push origin main || git push origin HEAD:master
            echo "Wiki succesvol gesynchroniseerd!"
          fi

